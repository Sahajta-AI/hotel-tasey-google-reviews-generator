<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review QR Poster</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --ivory: #faf6ef; --ink: #0f1b3d; --navy: #011a51; --brass: #b8862f; --brass-light: #f0d28c;
      --muted: #6f6a60; --line: #e9e1d3;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7e1d6; color: var(--ink); font: 500 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }

    .tools { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .tools input { flex: 1 1 240px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 14px; background: #fff; }
    .tools button { padding: 11px 18px; border: 0; border-radius: 12px; background: var(--navy); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }

    .poster {
      position: relative;
      width: 148mm; height: 210mm; max-width: calc(100% - 32px);
      margin: 0 auto 32px;
      background: var(--ivory);
      overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(1, 26, 81, .2);
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .photo { position: relative; height: 34%; background: url("img/facade.jpg") center 45% / cover; }
    .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(1, 18, 58, .72) 0%, rgba(1, 18, 58, .38) 42%, rgba(250, 246, 239, 0) 64%, var(--ivory) 94%); }
    .brand { position: absolute; z-index: 1; top: 9mm; left: 0; right: 0; text-align: center; color: #fff; }
    .brand img { width: 16mm; height: 16mm; border-radius: 3.5mm; background: #fff; box-shadow: 0 2mm 6mm rgba(0, 0, 0, .25); }
    .brand .name { margin: 2.5mm 0 0; font: 600 21pt/1 var(--serif); letter-spacing: .01em; }
    .brand .place { margin: 1.5mm 0 0; font-size: 7pt; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; opacity: .9; }

    .body { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 12mm 9mm; margin-top: -6mm; position: relative; }
    .eyebrow { margin: 0; font-size: 7.5pt; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--brass); }
    h1 { margin: 2mm 0 0; font: 600 30pt/1 var(--serif); letter-spacing: -.01em; }
    .sub { margin: 2.5mm 0 0; font-size: 10.5pt; color: var(--muted); }
    .stars { display: flex; gap: 1.5mm; margin: 4mm 0 0; }
    .stars svg { width: 5.5mm; height: 5.5mm; fill: url(#brass); }

    .qr-frame { position: relative; margin-top: 5mm; padding: 4mm; background: #fff; border-radius: 4mm; box-shadow: 0 1mm 4mm rgba(15, 27, 61, .08); }
    .qr-frame::before, .qr-frame::after { content: ""; position: absolute; width: 7mm; height: 7mm; border: .6mm solid var(--brass); }
    .qr-frame::before { top: -1.5mm; left: -1.5mm; border-right: 0; border-bottom: 0; border-top-left-radius: 4.5mm; }
    .qr-frame::after { bottom: -1.5mm; right: -1.5mm; border-left: 0; border-top: 0; border-bottom-right-radius: 4.5mm; }
    #qr { width: 44mm; height: 44mm; }
    #qr svg { display: block; width: 100%; height: 100%; }

    .steps { display: flex; justify-content: center; gap: 5mm; margin: 6mm 0 0; padding: 0; list-style: none; }
    .steps li { width: 28mm; font-size: 8pt; line-height: 1.35; color: var(--ink); }
    .steps .n { display: grid; place-items: center; width: 6.5mm; height: 6.5mm; margin: 0 auto 1.5mm; border: .3mm solid var(--brass); border-radius: 50%; font: 600 11pt/1 var(--serif); color: var(--brass); }
    .foot { margin-top: auto; font: italic 500 12pt/1 var(--serif); color: var(--brass); }

    @media print {
      @page { size: A5; margin: 0; }
      body { background: #fff; }
      .tools { display: none; }
      .poster { margin: 0; max-width: none; box-shadow: none; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0D28C"/><stop offset="1" stop-color="#B8862F"/></linearGradient>
      <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.8l2.75 5.6 6.15.9-4.45 4.34 1.05 6.12L12 16.9l-5.5 2.86 1.05-6.12L3.1 9.3l6.15-.9z"/></symbol>
    </defs>
  </svg>

  <div class="tools">
    <input id="url" aria-label="Link inside the QR code">
    <button type="button" id="print">Print poster</button>
  </div>

  <div class="poster">
    <div class="photo">
      <div class="brand">
        <img src="logo.png" alt="The Tasey Hotel logo">
        <p class="name">The Tasey Hotel</p>
        <p class="place">Amer &middot; Jaipur &middot; Pure vegetarian</p>
      </div>
    </div>
    <div class="body">
      <p class="eyebrow">Thank you for staying with us</p>
      <h1>Enjoyed your stay?</h1>
      <p class="sub">Scan to review us on Google. It takes a minute.</p>
      <div class="stars" aria-hidden="true">
        <svg><use href="#star"/></svg><svg><use href="#star"/></svg><svg><use href="#star"/></svg><svg><use href="#star"/></svg><svg><use href="#star"/></svg>
      </div>
      <div class="qr-frame"><div id="qr"></div></div>
      <ol class="steps">
        <li><span class="n">1</span>Scan with your phone camera</li>
        <li><span class="n">2</span>Tap the stars and pick a review</li>
        <li><span class="n">3</span>Paste it on Google and post</li>
      </ol>
      <p class="foot">We hope to see you again</p>
    </div>
  </div>

  <script>
    // The QR points at this site's review page. Use ?url= to point it elsewhere.
    const input = document.getElementById("url");
    const fromQuery = new URLSearchParams(location.search).get("url");
    input.value = fromQuery || new URL("./", location.href).href;

    function draw() {
      const qr = qrcode(0, "M");
      qr.addData(input.value.trim());
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    }
    input.addEventListener("input", draw);
    document.getElementById("print").addEventListener("click", () => window.print());
    draw();
  </script>
</body>
</html>
