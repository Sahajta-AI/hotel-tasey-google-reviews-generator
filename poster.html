<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review QR Poster</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="logo.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    :root { --navy: #011a51; --amber: #a95a01; --cream: #f8f3ea; --line: #e5dccb; --muted: #605a50; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e3d8; color: var(--navy); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .tools { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .tools input { flex: 1 1 240px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 14px; }
    .tools button { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .poster {
      width: 148mm; min-height: 210mm; max-width: calc(100% - 32px);
      margin: 0 auto 32px; padding: 14mm 12mm; background: var(--cream);
      border: 6px solid var(--navy); outline: 2px solid #ffc76b; outline-offset: -14px;
      text-align: center; display: flex; flex-direction: column; align-items: center;
    }
    .poster img.logo { width: 72px; height: 72px; border-radius: 14px; }
    .name { font: 700 22px/1.2 Georgia, serif; margin: 10px 0 0; }
    .place { color: var(--muted); font-size: 14px; margin: 0; }
    h1 { font: 700 32px/1.15 Georgia, serif; margin: 22px 0 4px; }
    .sub { margin: 0 0 18px; font-size: 17px; }
    .stars { color: #f5b400; font-size: 30px; letter-spacing: 6px; margin-bottom: 14px; }
    #qr { background: #fff; padding: 12px; border-radius: 16px; border: 1px solid var(--line); width: 62%; max-width: 230px; }
    #qr svg { display: block; width: 100%; height: auto; }
    ol { text-align: left; margin: 20px auto 0; padding-left: 22px; font-size: 15px; max-width: 280px; }
    ol li { margin-bottom: 4px; }
    .thanks { margin-top: auto; padding-top: 18px; color: var(--amber); font-weight: 600; }
    @media print {
      @page { size: A5; margin: 0; }
      body { background: #fff; }
      .tools { display: none; }
      .poster { margin: 0; max-width: none; width: 148mm; height: 210mm; }
    }
  </style>
</head>
<body>
  <div class="tools">
    <input id="url" aria-label="Link inside the QR code">
    <button type="button" id="print">Print poster</button>
  </div>

  <div class="poster">
    <img class="logo" src="logo.png" alt="The Tasey Hotel logo">
    <p class="name">The Tasey Hotel</p>
    <p class="place">Amer, Jaipur</p>
    <h1>Enjoyed your stay?</h1>
    <p class="sub">Scan to review us on Google</p>
    <div class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
    <div id="qr"></div>
    <ol>
      <li>Scan the code with your phone camera</li>
      <li>Tap the stars and pick a review</li>
      <li>Paste it on Google and post</li>
    </ol>
    <p class="thanks">Thank you for staying with us</p>
  </div>

  <script>
    // The QR points at this site's review page. Use ?url= to point it elsewhere.
    const input = document.getElementById("url");
    const fromQuery = new URLSearchParams(location.search).get("url");
    input.value = fromQuery || new URL("./", location.href).href;

    function draw() {
      const qr = qrcode(0, "M");
      qr.addData(input.value.trim());
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    }
    input.addEventListener("input", draw);
    document.getElementById("print").addEventListener("click", () => window.print());
    draw();
  </script>
</body>
</html>
